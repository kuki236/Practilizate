<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><title>Búsqueda de prácticas</title></head>
<body>
<main>
<h1>Prácticas preprofesionales</h1>
<form class="filtros-form">
  <fieldset><label><input type="radio" name="modalidad" value="PREPROFESIONAL" checked><span>Preprofesional</span></label></fieldset>
  <fieldset class="filtros-form__careers"><label><input type="radio" name="carrera" value="" checked><span>Todos</span></label><label><input type="radio" name="carrera" value="1" data-nombre="ADMINISTRACION"><span>ADMINISTRACION</span></label><label><input type="radio" name="carrera" value="10" data-nombre="INGENIERIA DE SISTEMAS"><span>INGENIERIA DE SISTEMAS</span></label><label><input type="radio" name="carrera" value="34" data-nombre="ARQUITECTURA"><span>ARQUITECTURA</span></label></fieldset>
  <fieldset><label><input type="radio" name="dep" value="15" checked><span>Lima</span></label></fieldset>
  <button type="submit">Buscar</button>
</form>
</main>
</body>
</html>
