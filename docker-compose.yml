services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: practilizate
      POSTGRES_USER: practilizate
      POSTGRES_PASSWORD: practilizate
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practilizate -d practilizate"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - practilizate_pgdata:/var/lib/postgresql/data

volumes:
  practilizate_pgdata:
