[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "practilizate"
version = "0.1.0"
description = "Reproducible observatory of pre-professional internship offers in Peru"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Practilizate contributors" }]
dependencies = [
  "beautifulsoup4>=4.12.3,<5",
  "httpx>=0.28.1,<1",
  "openpyxl>=3.1.5,<4",
  "psycopg[binary]>=3.2.3,<4",
  "pydantic>=2.10.3,<3",
  "pydantic-settings>=2.7.0,<3",
  "sqlalchemy>=2.0.36,<3",
]

[project.optional-dependencies]
dev = [
  "pillow>=11.1.0,<12",
  "pytest>=8.3.4,<9",
  "ruff>=0.8.4,<1",
]

[project.scripts]
practilizate = "practilizate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/practilizate"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/e2e"]
addopts = "-ra"
markers = ["e2e: end-to-end pipeline tests"]
